- name: Download VS Professional 2019 16.11.63
  ansible.windows.win_get_url:
    url: https://download.visualstudio.microsoft.com/download/pr/9dacffc2-1f48-4c30-82da-123d3fe0e842/6641bea4b1488a6e565c8bf7bd11f720b4b257a56da7af5ea24699a335a4833f/vs_Professional.exe
    dest: C:\Users\Public\Documents
  register: result
  retries: 5
  delay: 30
  until: result is not failed
  tags: vs2019

- name: Download VS Professional 2022
  ansible.windows.win_get_url:
    url: https://aka.ms/vs/17/release/vs_professional.exe
    dest: C:\Users\Public\Documents
  register: result
  retries: 5
  delay: 30
  until: result is not failed
  tags: vs2022

- name: Download VS Professional 2026
  ansible.windows.win_get_url:
    url: https://aka.ms/vs/stable/vs_professional.exe
    dest: C:\Users\Public\Documents
  register: result
  retries: 5
  delay: 30
  until: result is not failed
  tags: vs2026

- name: Install VS Professional
  win_package:
    path: C:\Users\Public\Documents\vs_professional.exe
    state: present
    arguments: 
      --wait
      --quiet
      --norestart
      --downloadThenInstall
      --add
      Microsoft.Net.Component.4.8.1.TargetingPack
      --add
      Microsoft.VisualStudio.Component.Debugger.JustInTime
      --add
      Microsoft.VisualStudio.Component.GraphDocument
      --add
      Microsoft.VisualStudio.Component.NuGet
      --add
      Microsoft.VisualStudio.Component.DockerTools
      --add
      Microsoft.VisualStudio.Component.VisualStudioData
      --add 
      Microsoft.VisualStudio.Component.Web
      --add 
      Microsoft.VisualStudio.Workload.ManagedDesktop
      --add 
      Microsoft.VisualStudio.Workload.Azure 
      --add 
      Microsoft.VisualStudio.Component.Wcf.Tooling 
      --add 
      Microsoft.VisualStudio.Component.SQL.SSDT 
      --add 
      Microsoft.VisualStudio.Workload.NetCoreTools 
      --add
      Microsoft.VisualStudio.Component.Windows10SDK
  tags: [ vs2019, vs2022, vs2026 ]

- name: Add VS 2019 Tags
  amazon.aws.ec2_tag:
    # aws_profile: '{{ awsProfile }}'
    region: "{{ hostvars['localhost']['awsRegion'] }}"
    resource: '{{ item }}'
    tags:
      VS: 'Visual Studio Professional 2019'
    state: present
  loop: "{{ hostvars['localhost'].ec2.instance_ids }}"
  delegate_to: localhost
  tags: vs2019

- name: Add VS 2022 Tags
  amazon.aws.ec2_tag:
    # aws_profile: '{{ awsProfile }}'
    region: "{{ hostvars['localhost']['awsRegion'] }}"
    resource: '{{ item }}'
    tags:
      VS: 'Visual Studio Professional 2022'
    state: present
  loop: "{{ hostvars['localhost'].ec2.instance_ids }}"
  delegate_to: localhost
  tags: vs2022

- name: Add VS 2026 Tags
  amazon.aws.ec2_tag:
    # aws_profile: '{{ awsProfile }}'
    region: "{{ hostvars['localhost']['awsRegion'] }}"
    resource: '{{ item }}'
    tags:
      VS: 'Visual Studio Professional 2026'
    state: present
  loop: "{{ hostvars['localhost'].ec2.instance_ids }}"
  delegate_to: localhost
  tags: vs2026