- name: AcuInstaller x64
  block:
  - name: Initialise Installer Variables
    set_fact:
      installerName32:
      installerName64:

  - name: Get {{ installerName }} Download URL from S3
    amazon.aws.s3_object:
      # profile: '{{ awsProfile }}'
      bucket: mturner
      mode: geturl
      object: '{{ S3Prefix }}{{ installerName }}'
      region: eu-west-2
      expiry: 4000
      sig_v4: true
    register: s3
    delegate_to: localhost

  - name: Download {{ installerName }}
    ansible.windows.win_get_url:
      url: '{{ s3.url }}'
      dest: C:\AcuInstallers
    register: result
    retries: 5
    delay: 30
    until: result is not failed

  - name: Add extend Tags
    amazon.aws.ec2_tag:
      # aws_profile: '{{ awsProfile }}'
      region: "{{ hostvars['localhost']['awsRegion'] }}"
      resource: '{{ item }}'
      tags:
        Name: "{{ semaphore_vars.task_details.username|upper }}-{{ hostvars['localhost']['imageName'] }} {{ productName }}"
        extend: '{{ installerName }}'
      state: present
    loop: "{{ hostvars['localhost'].ec2.instance_ids }}"
    delegate_to: localhost

  - name: Install {{ installerName }}
    win_package:
      path: C:\AcuInstallers\{{ installerName }}
      state: present
      arguments: ADDLOCAL=ALL WINDOWSVERSION=PostWindows7 /qb
  when: acuVer | int <= 1100

- name: AcuInstaller x86 + x64
  block:
  - name: Initialise Installer Variables
    set_fact:
      installerName:

  - name: Get {{ installerName32 }} Download URL from S3
    amazon.aws.s3_object:
      # profile: '{{ awsProfile }}'
      bucket: mturner
      mode: geturl
      object: '{{ S3Prefix }}{{ installerName32 }}'
      region: eu-west-2
      expiry: 4000
      sig_v4: true
    register: s332
    delegate_to: localhost
  
  - name: Get {{ installerName64 }} Download URL from S3
    amazon.aws.s3_object:
      # profile: '{{ awsProfile }}'
      bucket: mturner
      mode: geturl
      object: '{{ S3Prefix }}{{ installerName64 }}'
      region: eu-west-2
      expiry: 4000
      sig_v4: true
    register: s364
    delegate_to: localhost

  - name: Download {{ installerName32 }}
    ansible.windows.win_get_url:
      url: '{{ s332.url }}'
      dest: C:\AcuInstallers
    register: result
    retries: 5
    delay: 30
    until: result is not failed
  
  - name: Download {{ installerName64 }}
    ansible.windows.win_get_url:
      url: '{{ s364.url }}'
      dest: C:\AcuInstallers
    register: result
    retries: 5
    delay: 30
    until: result is not failed

  - name: Add extend Tags
    amazon.aws.ec2_tag:
      # aws_profile: '{{ awsProfile }}'
      region: "{{ hostvars['localhost']['awsRegion'] }}"
      resource: '{{ item }}'
      tags:
        Name: "{{ semaphore_vars.task_details.username|upper }}-{{ hostvars['localhost']['imageName'] }} {{ productName }}"
        extend: '{{ installerName32 }} and {{ installerName64 }}'
      state: present
    loop: "{{ hostvars['localhost'].ec2.instance_ids }}"
    delegate_to: localhost

  - name: Install {{ installerName32 }}
    win_package:
      path: C:\AcuInstallers\{{ installerName32 }}
      state: present
      arguments: /quiet StartAcuConnect=0 StartAcuServer=0 StartAcuToWeb=0 LaunchActivator=0 SetupType=Complete BisUserName={{ myUsername }} BisPassword={{ myPassword }}
    
  - name: Install {{ installerName64 }}
    win_package:
      path: C:\AcuInstallers\{{ installerName64 }}
      state: present
      arguments: /quiet StartAcuConnect=0 StartAcuServer=0 StartAcuToWeb=0 LaunchActivator=0 SetupType=Complete BisUserName={{ myUsername }} BisPassword={{ myPassword }}
  when: acuVer | int >= 1110

- name: Activate 32 bit Licenses
  win_command:
    cmd: '"{{ installPath32 }}\AcuGT\bin\activator.exe" /PCODE={{ CODE86 }} /PKEY={{ KEY86 }}'
    chdir: '{{ installPath32 }}\AcuGT\bin'

- name: Activate 64 bit Licenses
  win_command:
    cmd: '"{{ installPath32 }}\AcuGT\bin\activator.exe" /PCODE={{ CODE64 }} /PKEY={{ KEY64 }}'
    chdir: '{{ installPath32 }}\AcuGT\bin'

- name: Admin rights for AcuRCL 32 bit
  win_regedit:
    path: HKCU:\Software\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers
    name: '{{ installPath32 }}\acurcl.exe'
    data: '~ RUNASADMIN'
    type: string

- name: Admin rights for AcuRCL 64 bit
  win_regedit:
    path: HKCU:\Software\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers
    name: '{{ installPath64 }}\acurcl.exe'
    data: '~ RUNASADMIN'
    type: string
  
